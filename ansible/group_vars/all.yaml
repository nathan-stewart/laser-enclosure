---
# Common project variables. These are intentionally centralized so old-project
# archaeology starts here, not inside individual playbooks.

kiosk_user: kiosk
app_dir: /opt/kiosk

# Static IP config. Set configure_static_ip=false if this host is managed by DHCP/Pi-hole.
configure_static_ip: false
laser_connection: "preconfigured"
laser_static_ip: "192.168.1.12/24"
laser_gateway: "192.168.1.1"
laser_dns: "192.168.1.2"

# App source path relative to ansible/ directory. This assumes repo layout:
#   laser-enclosure/
#     ansible/
#     src/
app_src: "{{ playbook_dir }}/../src/"

# MeerK40t install target.
meerk40t_pip_spec: "git+https://github.com/meerk40t/meerk40t.git@0.9.9000"

# GPIO boot defaults. Keep comments aligned with actual hal.py/control.py wiring.
# NOTE: update these if the K2/K4 spare/HPA move is reflected differently in code.
gpio_boot_lines:
  - "gpio=22=ip,pu   # i_m7"
  - "gpio=27=ip,pu   # i_m8"
  - "gpio=17=ip,pu   # i_estop"
  - "gpio=7=op,dl    # k1_spare"
  - "gpio=8=op,dl    # laser_enable"
  - "gpio=25=op,dl   # lpa_enable"
  - "gpio=24=op,dl   # hpa_enable"
  - "gpio=23=op,dl   # k5_spare"
  - "gpio=18=op,dl   # k6_spare"
  - "gpio=12=op,dl   # exhaust_enable"
  - "gpio=16=op,dl   # dryer_enable"
