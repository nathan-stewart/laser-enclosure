- hosts: laser
  become: yes
  vars:
    kiosk_user: kiosk
    app_dir: /opt/kiosk

  tasks:
    - name: Ensure GPIO initial state is configured in /boot/config.txt
      become: yes
      lineinfile:
        path: /boot/config.txt
        line: "{{ item }}"
        create: yes
        state: present
      loop:
        - "gpio=22=ip,pu   # i_m7"
        - "gpio=27=ip,pu   # i_m8"
        - "gpio=17=ip,pu   # i_lid"
        - "gpio=7=op,dl    # o_k1_laser"
        - "gpio=8=op,dl    # o_k2_hpa"
        - "gpio=25=op,dl   # o_k3_fire"
        - "gpio=24=op,dl   # o_k4_light"
        - "gpio=23=op,dl   # o_k5_lpa"
        - "gpio=18=op,dl   # o_k6_dry_fan"
        - "gpio=12=op,dl   # o_k7_exhaust"
        - "gpio=16=op,dl   # o_k8_dry_heat"
      tags: gpio-config

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - python3-zmq
          - python3-pyqt5
          - python3-rpi-lgpio
          - python3-opencv
          - watchdog
        state: present
        update_cache: yes

    - name: Install Python libraries system wide
      pip:
        name:
        - adafruit-circuitpython-ads1x15
        - adafruit-circuitpython-mcp230xx
        - adafruit-circuitpython-bme280
        - adafruit-circuitpython-seesaw
        extra_args: --break-system-packages

    - name: Ensure /opt/kiosk directory exists
      file:
        path: /opt/kiosk
        state: directory
        owner: kiosk
        group: kiosk
        mode: '0755'

    - name: Deploy full application to /opt/kiosk
      copy:
        src: "/home/nps/projects/laser-enclosure/src/"
        dest: "/opt/kiosk/"
        owner: kiosk
        group: kiosk
        mode: '0755'

    - name: Create HAL GPIO and Sensor systemd service
      copy:
        dest: /etc/systemd/system/kiosk-hal.service
        mode: '0644'
        content: |
          [Unit]
          Description=HAL GPIO and Sensor Service
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=30
          StartLimitBurst=5

          [Service]
          Type=simple
          Restart=on-failure
          RestartSec=5
          ExecStart=/usr/bin/python3 /opt/kiosk/run_hal.py --log=DEBUG
          StandardOutput=journal
          StandardError=journal
          TimeoutStartSec=10
          KillSignal=SIGINT
          User=kiosk
          Group=kiosk
          WorkingDirectory=/opt/kiosk
          SyslogIdentifier=kiosk-hal

          [Install]
          WantedBy=multi-user.target
      register: hal_unit

    - name: Create Control layer systemd service
      copy:
        dest: /etc/systemd/system/kiosk-control.service
        mode: '0644'
        content: |
          [Unit]
          Description=Laser Control Logic (Supervisor)
          Requires=kiosk-hal.service
          After=kiosk-hal.service network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=30
          StartLimitBurst=5

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /opt/kiosk/run_control.py --log=DEBUG
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          User=kiosk
          Group=kiosk
          WorkingDirectory=/opt/kiosk
          SyslogIdentifier=kiosk-control

          [Install]
          WantedBy=multi-user.target
      register: control_unit

    - name: Install GUI and Python dependencies
      apt:
        name:
          - python3-pyqt5
          - python3-pip
          - fonts-dejavu
        state: present
        update_cache: yes

    - name: Restart kiosk-hal service after deploy
      systemd:
        name: kiosk-hal.service
        state: restarted
      when : hal_unit.changed

    - name: Restart kiosk-control service after deploy
      systemd:
        name: kiosk-control.service
        state: restarted
      when: control_unit.changed
