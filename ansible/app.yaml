---
- name: Deploy laser enclosure HAL/control application
  hosts: laser
  become: true

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart kiosk-hal
      systemd:
        name: kiosk-hal.service
        state: restarted

    - name: Restart kiosk-control
      systemd:
        name: kiosk-control.service
        state: restarted

  tasks:
    - name: Install HAL/control OS packages
      apt:
        name:
          - python3
          - python3-pip
          - python3-zmq
          - python3-pyqt5
          - python3-rpi-lgpio
          - python3-opencv
          - python3-sdnotify
          - fonts-dejavu
          - watchdog
        state: present
        update_cache: yes
      tags: [app, packages]

    - name: Install Adafruit/CircuitPython libraries system wide
      pip:
        name:
          - adafruit-circuitpython-ads1x15
          - adafruit-circuitpython-mcp230xx
          - adafruit-circuitpython-bme280
          - adafruit-circuitpython-seesaw
        executable: pip3
        extra_args: --break-system-packages
      tags: [app, python]

    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ kiosk_user }}"
        group: "{{ kiosk_user }}"
        mode: '0755'
      tags: [app]

    - name: Deploy application tree to kiosk
      copy:
        src: "{{ app_src }}"
        dest: "{{ app_dir }}/"
        owner: "{{ kiosk_user }}"
        group: "{{ kiosk_user }}"
        mode: preserve
      notify:
        - Restart kiosk-hal
        - Restart kiosk-control
      tags: [app, deploy]

    - name: Install halctl MeerK40t plugin from deployed local source
      pip:
        name: "{{ app_dir }}/meerk40t-halctl"
        executable: pip3
        extra_args: --break-system-packages --editable
      tags: [app, halctl, meerk40t]

    - name: Create HAL GPIO and sensor systemd service
      copy:
        dest: /etc/systemd/system/kiosk-hal.service
        mode: '0644'
        content: |
          [Unit]
          Description=HAL GPIO and Sensor Service
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=30
          StartLimitBurst=5

          [Service]
          Type=simple
          Restart=on-failure
          RestartSec=5
          ExecStart=/usr/bin/python3 {{ app_dir }}/run_hal.py --log=DEBUG
          StandardOutput=journal
          StandardError=journal
          TimeoutStartSec=10
          KillSignal=SIGINT
          User={{ kiosk_user }}
          Group={{ kiosk_user }}
          WorkingDirectory={{ app_dir }}
          SyslogIdentifier=kiosk-hal

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart kiosk-hal
      tags: [app, services, hal]

    - name: Create control layer systemd service
      copy:
        dest: /etc/systemd/system/kiosk-control.service
        mode: '0644'
        content: |
          [Unit]
          Description=Laser Control Logic Supervisor
          Requires=kiosk-hal.service
          After=kiosk-hal.service network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=30
          StartLimitBurst=5

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 {{ app_dir }}/run_control.py --log=DEBUG
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          User={{ kiosk_user }}
          Group={{ kiosk_user }}
          WorkingDirectory={{ app_dir }}
          SyslogIdentifier=kiosk-control

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart kiosk-control
      tags: [app, services, control]

    - name: Flush handlers before enabling services
      meta: flush_handlers
      tags: [app, services]

    - name: Enable and start kiosk services
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
        daemon_reload: yes
      loop:
        - kiosk-hal.service
        - kiosk-control.service
      tags: [app, services]
